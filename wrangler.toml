name = "events-management"
account_id = "a7d0d01173e21d68d5e7509e25416a51"
main = "server/worker.ts"
compatibility_date = "2026-06-15"
compatibility_flags = ["nodejs_compat"]
keep_vars = true

[vars]
APP_DATA_SOURCE = "supabase"
PUBLIC_APP_URL = "https://em.devcongress.org"
PUBLIC_FRONTEND_ORIGIN = "https://em.devcongress.org"
SPEAKER_EMAIL_FROM = "DevCongress Monthly Speakers <speakers@updates.devcongress.org>"
SPEAKER_EMAIL_REPLY_TO = "hello@devcongress.org"

# Immutable PNG cards for archive-request email. Wrangler provisions the R2
# bucket on the first deployment, then binds it here as SPEAKER_EMAIL_ASSETS.
[[r2_buckets]]
binding = "SPEAKER_EMAIL_ASSETS"

[observability]
enabled = true
