name = "events-management"
account_id = "a7d0d01173e21d68d5e7509e25416a51"
main = "server/worker.ts"
compatibility_date = "2026-06-15"
compatibility_flags = ["nodejs_compat"]
keep_vars = true

[vars]
NODE_ENV = "production"
APP_DATA_SOURCE = "supabase"
PUBLIC_APP_URL = "https://em.devcongress.org"
PUBLIC_FRONTEND_ORIGIN = "https://em.devcongress.org"
PUBLIC_WEBSITE_ORIGIN = "https://devcongress.org"
PUBLIC_API_CORS_ORIGINS = "https://devcongress.org,https://www.devcongress.org"
# Sandbox routes only; never extend general public or organizer CORS to previews.
DEVCON26_TEST_CHECKOUT_ORIGINS = "https://feature-devcon26-public-checkout-devcongress-website.admins-a7d.workers.dev,https://63b14d94-devcongress-website.admins-a7d.workers.dev"
SHORT_LINK_PUBLIC_ORIGIN = "https://go.devcongress.org"
TURNSTILE_EXPECTED_HOSTNAME = "em.devcongress.org"
EVENT_SUBMISSION_TURNSTILE_EXPECTED_HOSTNAMES = "devcongress.org,www.devcongress.org"
SPEAKER_EMAIL_REPLY_TO = "hello@updates.devcongress.org"
REGISTRATION_EMAIL_REPLY_TO = "hello@updates.devcongress.org"
EVENT_EMAIL_REPLY_TO = "hello@updates.devcongress.org"
EVENT_SUBMISSION_REPLY_DOMAIN = "updates.devcongress.org"

[observability]
enabled = true

[triggers]
# A minute-level trigger isolates one scheduled route per invocation. Slots 0-8
# dispatch the nine scheduled jobs. Volunteer drain additionally uses slots 9,
# 11, and 13; slots 10, 12, and 14 stay idle. This creates four isolated
# volunteer processing opportunities each cycle without combining request budgets.
crons = ["* * * * *"]

# Broadcast preparation is deliberately asynchronous. One queue delivery imports
# only a small audience slice, avoiding the per-request outbound-fetch ceiling
# before Resend receives the final broadcast request.
[[queues.producers]]
queue = "event-blast-preparation"
binding = "EVENT_BLAST_PREPARATION_QUEUE"

[[queues.consumers]]
queue = "event-blast-preparation"
max_batch_size = 1
max_batch_timeout = 5
max_retries = 5
dead_letter_queue = "event-blast-preparation-dead-letter"
max_concurrency = 1
