name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Dependencies, typecheck, test, and build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # Update the image tag, digest, and expected version together with the Playwright lockfile.
    container:
      image: mcr.microsoft.com/playwright:v1.60.0-noble@sha256:9bd26ad900bb5e0f4dee75839e957a89ae89c2b7ab1e76050e559790e946b948
      options: --init --ipc=host
    env:
      PLAYWRIGHT_IMAGE_VERSION: '1.60.0'

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup pnpm
        uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8
        with:
          version: 10.24.0

      - name: Setup Node
        uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6.0.0
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify Playwright image and browser
        timeout-minutes: 1
        run: |
          node --input-type=module <<'NODE'
          import { access } from 'node:fs/promises';
          import { constants } from 'node:fs';
          import { createRequire } from 'node:module';

          const require = createRequire(import.meta.url);
          const version = require('playwright/package.json').version;
          const { chromium } = require('playwright');

          if (version !== process.env.PLAYWRIGHT_IMAGE_VERSION) {
            throw new Error(`Playwright ${version} does not match image ${process.env.PLAYWRIGHT_IMAGE_VERSION}. Update the image tag, digest, and expected version.`);
          }

          await access(chromium.executablePath(), constants.X_OK);

          const browser = await chromium.launch();

          await browser.close();
          console.log(`Playwright ${version} and Chromium are ready.`);
          NODE

      - name: Audit dependencies
        run: pnpm audit:dependencies

      - name: Lint
        run: pnpm lint

      - name: Verify migration inventory and contracts (offline)
        run: pnpm verify:migrations:offline

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Organizer browser journeys
        timeout-minutes: 5
        run: pnpm test:journeys

      - name: Upload journey evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: organizer-journeys
          path: artifacts/organizer-journeys/
          if-no-files-found: ignore
          retention-days: 7

  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GITLEAKS_VERSION: 8.30.1
      GITLEAKS_LINUX_X64_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - name: Checkout full history
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Setup Node for artifact integrity
        uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6.0.0
        with:
          node-version: 20

      - name: Verify skeleton artifact hashes
        run: node tools/verify-boneyard-manifest.mjs

      - name: Install checksummed Gitleaks
        shell: bash
        run: |
          archive="${RUNNER_TEMP}/gitleaks.tar.gz"
          curl --fail --silent --show-error --location \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            --output "${archive}"
          echo "${GITLEAKS_LINUX_X64_SHA256}  ${archive}" | sha256sum --check -
          tar -xzf "${archive}" -C "${RUNNER_TEMP}" gitleaks
          echo "${RUNNER_TEMP}" >> "${GITHUB_PATH}"

      - name: Scan full Git history
        run: gitleaks git --redact --no-banner --exit-code 1 .

  codeql:
    name: CodeQL
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Initialize CodeQL
        uses: github/codeql-action/init@7211b7c8077ea37d8641b6271f6a365a22a5fbfa # v4.36.0
        with:
          languages: javascript-typescript

      - name: Analyze
        uses: github/codeql-action/analyze@7211b7c8077ea37d8641b6271f6a365a22a5fbfa # v4.36.0
