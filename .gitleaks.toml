title = "DevCongress Events Management Gitleaks configuration"

[extend]
useDefault = true

[[rules]]
id = "generic-api-key"

  [[rules.allowlists]]
  description = "Ignore validated SHA-256 migration inventory entries"
  condition = "AND"
  regexTarget = "line"
  paths = ['''^supabase/migration-verification-contract\.json$''']
  regexes = ['''^\s*"[0-9]{14}_[a-z0-9_]+\.sql"\s*:\s*"[0-9a-f]{64}",?\s*$''']

  [[rules.allowlists]]
  description = "Ignore independently verified SHA-256 skeleton artifact inventory rows"
  condition = "AND"
  regexTarget = "line"
  paths = ['''^\.auto-skeleton/manifest\.json$''']
  regexes = ['''^\s*"src/bones/[a-z0-9-]+\.bones\.json"\s*:\s*"[0-9a-f]{64}",?\s*$''']
